# pp_controller 参数配置 (RPP 增强版)

pp_controller:
  ros__parameters:
    # === 位姿源（map系）===
    # pose_source:
    #   - "tf"        : 使用 TF (global_frame->base_frame)
    #   - "odom_topic": 订阅 nav_msgs/Odometry，且 header.frame_id 必须是 global_frame
    pose_source: "odom_topic"
    pose_topic: "/Odometry"
    pose_timeout: 0.5
    global_frame: "map"
    base_frame: "base_link"
    cmd_vel_topic: "/cmd_vel"

    # === 速度限制 ===
    max_linear_vel: 0.5       # 最大线速度 (m/s)
    min_linear_vel: 0.05      # 最小线速度 (m/s)
    max_angular_vel: 1.0      # 最大角速度 (rad/s)
    
    # === Pure Pursuit 参数 ===
    lookahead_gain: 0.5       # 前瞻距离增益 K_LD
    lookahead_min: 0.2        # 最小前瞻距离 (m)
    lookahead_max: 1.0        # 最大前瞻距离 (m) [RPP增强]
    
    # === 到点阈值 ===
    position_tolerance: 0.05  # 位置容差 (m)
    angle_tolerance: 0.05     # 角度容差 (rad, ~3°)
    
    # === 旋转控制 ===
    spin_kp: 2.0              # 旋转P增益
    
    # === 控制频率 ===
    control_rate: 20.0        # 控制循环频率 (Hz)
    
    # === 路径文件 ===
    path_file: ""             # 可通过 ros2 param set 动态加载
    
    # === RPP 增强参数 ===
    curvature_min_radius: 0.9       # 曲率调节半径 (m)，越大减速越明显
    max_lateral_deviation: 0.3      # 最大横向偏差 (m)，超限停止
    use_curvature_regulation: true  # 是否启用曲率调节减速
    
    # === 障碍物检测 ===
    laser_topic: "/scan"
    obstacle_distance_threshold: 0.5  # 障碍物检测距离阈值 (m)
    obstacle_angle_range: 0.5         # 前方检测角度范围 (rad, ~30°)
    
    # === Costmap 集成 ===
    costmap_topic: "/local_costmap/costmap"
    cost_scaling_dist: 0.6    # 触发减速的代价距离
    cost_scaling_gain: 0.5    # 最低减速因子 (0.5 = 最多减速50%)
    use_costmap: true         # 是否启用 Costmap 减速
